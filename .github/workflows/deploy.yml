# develop に push（マージ）されたらテスト環境へ、master に push されたら本番へデプロイする。
#
# 設定値とデプロイ用の鍵は、GitHub の Environments（dev / prod）の Secrets に置く。
#   FIREBASE_ENV_JSON        … 設定ファイル（app/firebase_env.example.json と同じ形式）の中身
#   FIREBASE_SERVICE_ACCOUNT … デプロイ用のサービスアカウントの鍵（JSON）の中身
# 各 Environment は、決まったブランチ（dev は develop、prod は master）からしか使えないようにしておく。
# 用意のしかたは tools/README.md の「自動デプロイ（GitHub Actions）」を参照。
#
# 手順は tools/deploy.ps1 と同じ（ビルド → Firestore のルール・インデックス → Hosting）。
# ルールを Hosting より先に出すのは、新しいアプリが新しいルールを前提にすることがあるため。

name: デプロイ

on:
  push:
    branches: [develop, master]
  # 失敗したときなどに、Actions の画面から手で実行し直せるようにする（develop / master のみ）
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチのデプロイは 1 つずつ順に行う（途中で止めない）
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'develop' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}
    env:
      EXPECTED_APP_ENV: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v5

      - name: 設定ファイルと鍵を用意する
        env:
          FIREBASE_ENV_JSON: ${{ secrets.FIREBASE_ENV_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          env_file="$RUNNER_TEMP/firebase_env.json"
          key_file="$RUNNER_TEMP/service_account.json"
          printf '%s' "$FIREBASE_ENV_JSON" > "$env_file"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key_file"

          app_env=$(jq -r '.APP_ENV // empty' "$env_file")
          project_id=$(jq -r '.FIREBASE_PROJECT_ID // empty' "$env_file")
          key_project_id=$(jq -r '.project_id // empty' "$key_file")

          # 取り違え（テスト環境の設定で本番に出すなど）を防ぐ
          if [ "$app_env" != "$EXPECTED_APP_ENV" ]; then
            echo "::error::設定ファイルの APP_ENV が ${EXPECTED_APP_ENV} ではありません（${app_env:-なし}）。"
            exit 1
          fi
          if [ -z "$project_id" ]; then
            echo "::error::設定ファイルに FIREBASE_PROJECT_ID がありません。"
            exit 1
          fi
          if [ "$key_project_id" != "$project_id" ]; then
            echo "::error::サービスアカウントの鍵のプロジェクトが、設定ファイルの FIREBASE_PROJECT_ID と違います。"
            exit 1
          fi

          echo "ENV_FILE=$env_file" >> "$GITHUB_ENV"
          echo "FIREBASE_PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key_file" >> "$GITHUB_ENV"
          echo "デプロイ先: ${EXPECTED_APP_ENV}（${project_id}）"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 手元の開発環境と同じ版にそろえる
          flutter-version: 3.47.8
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: ビルドする
        working-directory: app
        run: flutter build web --dart-define-from-file="$ENV_FILE"

      - name: Firestore のルール・インデックスをデプロイする
        working-directory: app
        run: npx --yes firebase-tools@15.34.1 deploy --only firestore --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Hosting をデプロイする
        working-directory: app
        run: npx --yes firebase-tools@15.34.1 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
